# Solo para tests. Spring Boot lee config/application.properties además de application.yml,
# con más prioridad: así ningún test sale a internet a pedir precios aunque se olvide de configurarlo.

# Los tests usan los valores de desarrollo (clave JWT, URL del front, Client ID de Google...).
# La base no: la pone Testcontainers.
spring.profiles.active=dev


# Un test que necesite el proveedor real lo pide explícitamente (ver PortfolixBackendApplicationTests).
portfolix.market.provider=fixed

# Todos los pedidos de MockMvc vienen de la misma IP (127.0.0.1): con el rate limit prendido, la suite
# se quedaría sin pedidos a mitad de camino. Lo prende RateLimitIntegrationTest, que es el que lo prueba.
portfolix.rate-limit.enabled=false
