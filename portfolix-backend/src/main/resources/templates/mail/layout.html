<!DOCTYPE html>
<!--
  Estructura común de los mails. Cada mail la usa con
  th:replace="~{mail/layout :: layout(~{::content})}" y define su texto en th:fragment="content".
  Los clientes de mail ignoran buena parte del CSS: por eso los estilos van en línea y el diseño en tablas.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${subject}">Portfolix</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f3f4f6;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3f4f6;">
    <tr>
        <td align="center" style="padding: 32px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width: 560px; background-color: #ffffff; border-radius: 12px;">
                <tr>
                    <td style="padding: 28px 32px 0; font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: bold; color: #111827;">
                        Portfolix
                    </td>
                </tr>
                <tr>
                    <td style="padding: 16px 32px 32px; font-family: Arial, Helvetica, sans-serif; font-size: 15px; line-height: 1.6; color: #374151;">
                        <div th:replace="${content}">Texto del mail</div>
                    </td>
                </tr>
            </table>
            <p style="max-width: 560px; margin: 16px auto 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.5; color: #6b7280;">
                Portfolix mandó este mail automáticamente. No respondas a esta dirección.
            </p>
        </td>
    </tr>
</table>
</body>
</html>
