# Perfil de desarrollo. No es el perfil por defecto: lo activan ./mvnw spring-boot:run (plugin de Maven)
# y los tests (src/test/resources/config/application.properties). Desde el IDE, agregarlo a la
# configuración de ejecución (ej.: variable de entorno SPRING_PROFILES_ACTIVE=dev).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolix}
    username: ${DB_USERNAME:portfolix}
    password: ${DB_PASSWORD:portfolix}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    # Mailpit (compose.yaml): recibe los mails sin mandarlos. Se leen en http://localhost:8025
    host: localhost
    port: 1025
    properties:
      mail.smtp.starttls.enable: false
      mail.smtp.starttls.required: false

portfolix:
  cors:
    allowed-origins: http://localhost:5173
  mail:
    from: Portfolix <no-reply@portfolix.test>
    frontend-url: http://localhost:5173
  auth:
    google:
      # El Client ID de desarrollo (no es secreto). Acepta orígenes de localhost.
      client-id: ${GOOGLE_CLIENT_ID:507921401511-dm19i3ojp7d12o4cfg6vhos79umk334b.apps.googleusercontent.com}
  jwt:
    # Solo para desarrollo. En otros entornos se define con la variable JWT_SECRET.
    secret: ${JWT_SECRET:dGc+Wcz3m8KgK1AIw8Qts5zfxHL/4wNDeE2C5tO7B7c=}
