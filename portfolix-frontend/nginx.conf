server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Encabezados de seguridad. Referrer-Policy: el botón de Google lo necesita en producción (ver la fase 8C del backend).
  add_header Referrer-Policy "no-referrer-when-downgrade" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Los archivos con hash de Vite (assets/) no cambian nunca: se cachean por un año. (Sin add_header acá, porque
  # un add_header en una location anula los del server y se perderían los de arriba.)
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # SPA: cualquier ruta (/transactions, /verify-email…) devuelve index.html y React Router resuelve la pantalla.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
